name: Deploy to VPS
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Runbookdagi standart deploy skripti: git pull -> pip install ->
          # alembic upgrade head -> wms-api va wms-smartup-worker restart -> /health.
          # Avval bu yerda `systemctl restart wms` edi, lekin bunday unit yo'q
          # (xizmatlar: wms-api, wms-smartup-worker) — shuning uchun kod tortilsa ham
          # jarayon qayta ishga tushmay, serverda eski kod ishlab turardi.
          script: |
            set -euo pipefail
            cd /var/www/wms/backend
            bash deploy/vps/update-wms.sh
