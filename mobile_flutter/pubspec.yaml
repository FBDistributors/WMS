name: mobile_flutter
description: WMS mobile app (Flutter).
publish_to: "none"
version: 1.0.13+16

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  mobile_scanner: ^7.0.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.4.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  collection: ^1.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.8.0

# RN `mobile/src/assets/logo.png`; legacy mipmaps only (no adaptive) to avoid Material You recoloring.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.png
    - assets/sounds/scan_beep.wav
